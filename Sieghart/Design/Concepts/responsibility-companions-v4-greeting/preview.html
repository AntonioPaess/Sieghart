<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sieghart — Novo alô</title>
<style>
:root{color-scheme:dark;--bg:#111315;--fg:#eeeae2;--muted:#a9aca9;--line:#363c39;--surface:#242a27}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px 48px}h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.7px}p{color:var(--muted);margin:8px 0 20px}.controls{display:flex;align-items:end;gap:16px;flex-wrap:wrap;margin:20px 0}label{display:grid;gap:6px;font-size:13px;color:var(--muted)}select,button{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}button{cursor:pointer}select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #a6cba7;outline-offset:3px}video{display:block;width:100%;aspect-ratio:8/3;background:#090a0c;border-radius:18px}#status{margin-top:16px;font-size:14px;min-height:24px}.phases{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.phases button{font-size:13px;padding:8px 12px}a{color:#c1d8bd}.note{font-size:13px;border-top:1px solid var(--line);padding-top:18px;margin-top:28px}@media(max-width:540px){main{padding:24px 16px}h1{font-size:25px}.controls{gap:10px}}
</style>
</head>
<body>
<main>
<h1>Um alô com personalidade</h1>
<p>Entrada, rebote, duas mãos e uma luz que passa do dourado ao azul.</p>
<div class="controls">
<label for="avatar">Avatar<select id="avatar"><option value="sig">Sig</option><option value="rita">Rita</option><option value="ada">Ada</option><option value="gantt">Gantt</option><option value="elinor">Elinor</option><option value="toni">Toni</option></select></label>
<button id="replay" type="button">Repetir o alô</button>
<label for="speed">Velocidade<select id="speed"><option value="1">Normal · 60 fps</option><option value="0.5">Metade · observar os gestos</option></select></label>
</div>
<video id="player" controls playsinline preload="metadata" poster="sig-wave.png" src="sig-hello-60fps.mp4" aria-label="Nova saudação do Sig">Abra sig-hello-60fps.mp4 nesta pasta para ver o vídeo.</video>
<p id="status" aria-live="polite">Pronto para reproduzir.</p>
<div class="phases"><button type="button" data-time="0">Entrada</button><button type="button" data-time="0.6">Rebote</button><button type="button" data-time="1.3">Alô / duas mãos</button><button type="button" data-time="2.45">Recolher</button><button type="button" data-time="3.85">Luz azul</button></div>
<p class="note">Prévia visual para revisão. Mãos e materiais acompanham cada personagem; Ada e Gantt preservam as proporções quadradas. <a href="../responsibility-companions-v3/preview.html">Ver os demais estados e atividades da prévia anterior</a>.</p>
</main>
<script>
(() => {
const player=document.getElementById('player'),avatar=document.getElementById('avatar'),speed=document.getElementById('speed'),status=document.getElementById('status');
let startOnLoad=false;
function play(){player.play().catch(()=>{status.textContent='Use o botão de reprodução do vídeo.'})}
function seek(t){if(player.readyState>=1){player.currentTime=t;play()}else{startOnLoad=true}}
avatar.addEventListener('change',()=>{startOnLoad=true;player.src=avatar.value+'-hello-60fps.mp4';player.poster=avatar.value+'-wave.png';player.setAttribute('aria-label','Nova saudação de '+avatar.selectedOptions[0].textContent);player.load()});
player.addEventListener('loadedmetadata',()=>{player.playbackRate=Number(speed.value);if(startOnLoad){player.currentTime=0;startOnLoad=false;play()}});
player.addEventListener('timeupdate',()=>{const t=player.currentTime;const phase=t<0.6?'Chegada e luz':t<1.3?'Rebote':t<2.45?'Alô — mãos com movimentos diferentes':t<3.45?'Recolhe as mãos e retorna':t<4.15?'Luz dourada → azul':'Pronto';status.textContent=phase+' · '+t.toFixed(2)+' s / 6 s'});
player.addEventListener('error',()=>{status.textContent='Não foi possível carregar o vídeo. Abra o MP4 correspondente nesta pasta.'});
speed.addEventListener('change',()=>{player.playbackRate=Number(speed.value)});
document.getElementById('replay').addEventListener('click',()=>seek(0));
document.querySelectorAll('[data-time]').forEach(button=>button.addEventListener('click',()=>seek(Number(button.dataset.time))));
})();
</script>
</body>
</html>
